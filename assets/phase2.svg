<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Phase 2 아키텍처 (stack 엔진)</title>
  <desc>setState가 루트 App을 다시 실행하고, 자식 순수 함수를 재귀로 호출해 새 VNode를 만든 뒤 Diff와 Patch를 거쳐 useEffect를 실행한다. 이 전체가 메인 스레드에서 한 번에 실행되어 키 입력이 기다린다.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#8B95A1"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#3182F6"/>
    </marker>
    <style>
      .h{font-size:26px;font-weight:800;fill:#191F28}
      .sub{font-size:16px;font-weight:500;fill:#8B95A1}
      .ct{font-size:19px;font-weight:700;fill:#191F28}
      .cc{font-size:14px;font-weight:500;fill:#6B7684}
      .card{fill:#F9FAFB;stroke:#E5E8EB;stroke-width:1.5}
      .ln{stroke:#B0B8C1;stroke-width:2;fill:none}
      .slot{font-size:13px;font-weight:600;fill:#1B64DA}
      .pill{font-size:13px;font-weight:700;fill:#4E5968}
      .seg{font-size:15px;font-weight:700;fill:#C9252F}
    </style>
  </defs>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
  <rect x="1" y="1" width="1198" height="638" rx="24" fill="#FFFFFF" stroke="#E5E8EB" stroke-width="2"/>
  <text class="h" x="48" y="66">Phase 2</text>
  <text class="sub" x="48" y="94">Component + State + Hooks (stack 엔진)</text>

  <rect class="card" x="48" y="130" width="150" height="200" rx="18"/>
  <text class="ct" x="68" y="166">setState</text>
  <text class="cc" x="68" y="190">상태 변경 요청</text>
  <rect x="68" y="214" width="110" height="30" rx="10" fill="#E8F3FF"/>
  <text class="slot" x="123" y="234" text-anchor="middle">query = 'dep'</text>

  <rect class="card" x="238" y="130" width="230" height="200" rx="18"/>
  <text class="ct" x="258" y="166">루트 App</text>
  <text class="cc" x="258" y="190">hooks 배열에 상태 보관</text>
  <g>
    <rect x="258" y="206" width="190" height="24" rx="7" fill="#E8F3FF"/><text class="slot" x="270" y="223">0  useState</text>
    <rect x="258" y="236" width="190" height="24" rx="7" fill="#E8F3FF"/><text class="slot" x="270" y="253">1  useState</text>
    <rect x="258" y="266" width="190" height="24" rx="7" fill="#E8F3FF"/><text class="slot" x="270" y="283">2  useMemo</text>
    <rect x="258" y="296" width="190" height="24" rx="7" fill="#E8F3FF"/><text class="slot" x="270" y="313">3  useEffect</text>
  </g>

  <rect class="card" x="508" y="130" width="250" height="200" rx="18"/>
  <text class="ct" x="528" y="166">자식 컴포넌트</text>
  <text class="cc" x="528" y="190">props만 받는 순수 함수</text>
  <g stroke="#C5CCD3" stroke-width="2">
    <line x1="690" y1="232" x2="690" y2="246"/>
    <line x1="690" y1="272" x2="690" y2="286"/>
  </g>
  <rect x="528" y="206" width="96" height="26" rx="13" fill="#FFFFFF" stroke="#D1D6DB"/><text class="pill" x="576" y="224" text-anchor="middle">SearchBar</text>
  <rect x="640" y="206" width="100" height="26" rx="13" fill="#FFFFFF" stroke="#D1D6DB"/><text class="pill" x="690" y="224" text-anchor="middle">Heatmap</text>
  <rect x="650" y="246" width="80" height="26" rx="13" fill="#FFFFFF" stroke="#D1D6DB"/><text class="pill" x="690" y="264" text-anchor="middle">Row</text>
  <rect x="620" y="286" width="120" height="26" rx="13" fill="#FFF0F0" stroke="#F7B5BA"/><text x="680" y="304" text-anchor="middle" font-size="13" font-weight="700" fill="#C9252F">Cell × 20,000</text>

  <rect class="card" x="798" y="130" width="160" height="200" rx="18"/>
  <text class="ct" x="818" y="166">Diff</text>
  <text class="cc" x="818" y="190">이전 트리 전체와</text>
  <text class="cc" x="818" y="210">새 트리를 비교</text>

  <rect class="card" x="998" y="130" width="154" height="200" rx="18"/>
  <text class="ct" x="1018" y="166">Patch</text>
  <text class="cc" x="1018" y="190">실제 DOM 반영</text>
  <rect x="1018" y="262" width="114" height="30" rx="10" fill="#E8F3FF"/>
  <text class="slot" x="1075" y="282" text-anchor="middle">useEffect 실행</text>
  <line x1="1075" y1="214" x2="1075" y2="256" stroke="#B0B8C1" stroke-width="2" marker-end="url(#ar)"/>

  <line class="ln" x1="198" y1="230" x2="232" y2="230" marker-end="url(#ar)"/>
  <line class="ln" x1="468" y1="230" x2="502" y2="230" marker-end="url(#ar)"/>
  <line class="ln" x1="758" y1="230" x2="792" y2="230" marker-end="url(#ar)"/>
  <line class="ln" x1="958" y1="230" x2="992" y2="230" marker-end="url(#ar)"/>

  <text class="ct" x="48" y="402" font-size="18">메인 스레드에서는</text>
  <text class="cc" x="48" y="428" font-size="15">위 과정이 재귀 호출 하나로 끝까지 실행된다. 한 번 시작하면 중간에 멈출 수 없다. (업데이트당 약 107ms)</text>

  <rect x="48" y="452" width="592" height="56" rx="12" fill="#FDE4E6"/>
  <text class="seg" x="344" y="486" text-anchor="middle">App + 자식 함수 실행 (셀 2만 개)</text>
  <rect x="644" y="452" width="196" height="56" rx="12" fill="#FBD3D7"/>
  <text class="seg" x="742" y="486" text-anchor="middle">전체 트리 Diff</text>
  <rect x="844" y="452" width="136" height="56" rx="12" fill="#F8C0C6"/>
  <text class="seg" x="912" y="486" text-anchor="middle">Patch</text>
  <rect x="990" y="452" width="162" height="56" rx="12" fill="#E8F3FF"/>
  <text x="1071" y="486" text-anchor="middle" font-size="15" font-weight="700" fill="#1B64DA">입력 처리</text>

  <rect x="240" y="540" width="120" height="34" rx="17" fill="#3182F6"/>
  <text x="300" y="562" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">키 입력 도착</text>
  <path d="M360 557 L1071 557 L1071 514" fill="none" stroke="#3182F6" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arb)"/>
  <text x="690" y="594" text-anchor="middle" font-size="14" font-weight="600" fill="#3182F6">렌더가 끝날 때까지 기다림 (입력 p95 152.3ms)</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
