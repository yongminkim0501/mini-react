<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Phase 1 아키텍처</title>
  <desc>실제 영역과 테스트 영역의 DOM을 VNode로 바꾸고, Diff로 변경 목록을 만든 뒤 실제 영역에 변경분만 Patch하고, 새 VNode를 History에 저장한다.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#8B95A1"/>
    </marker>
    <style>
      .h{font-size:26px;font-weight:800;fill:#191F28}
      .sub{font-size:16px;font-weight:500;fill:#8B95A1}
      .ct{font-size:19px;font-weight:700;fill:#191F28}
      .cc{font-size:14px;font-weight:500;fill:#6B7684}
      .lb{font-size:15px;font-weight:600;fill:#4E5968}
      .num{font-size:13px;font-weight:800;fill:#FFFFFF}
      .card{fill:#F9FAFB;stroke:#E5E8EB;stroke-width:1.5}
      .ln{stroke:#B0B8C1;stroke-width:2;fill:none}
    </style>
  </defs>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
  <rect x="1" y="1" width="1198" height="618" rx="24" fill="#FFFFFF" stroke="#E5E8EB" stroke-width="2"/>
  <text class="h" x="48" y="66">Phase 1</text>
  <text class="sub" x="48" y="94">Virtual DOM + Diff + Patch</text>

  <rect class="card" x="48" y="130" width="300" height="120" rx="18"/>
  <text class="ct" x="70" y="166">실제 영역</text>
  <text class="cc" x="70" y="190">화면에 보이는 DOM</text>
  <g fill="#D1D6DB"><rect x="232" y="158" width="94" height="10" rx="5"/><rect x="232" y="178" width="70" height="10" rx="5"/><rect x="232" y="198" width="84" height="10" rx="5"/><rect x="232" y="218" width="56" height="10" rx="5"/></g>

  <rect class="card" x="852" y="130" width="300" height="120" rx="18"/>
  <text class="ct" x="874" y="166">테스트 영역</text>
  <text class="cc" x="874" y="190">사용자가 직접 수정</text>
  <g fill="#D1D6DB"><rect x="1036" y="158" width="94" height="10" rx="5"/><rect x="1036" y="198" width="84" height="10" rx="5"/><rect x="1036" y="218" width="56" height="10" rx="5"/></g>
  <rect x="1036" y="178" width="70" height="10" rx="5" fill="#3182F6"/>

  <line class="ln" x1="198" y1="250" x2="198" y2="314" marker-end="url(#ar)"/>
  <circle cx="224" cy="285" r="11" fill="#3182F6"/><text class="num" x="224" y="290" text-anchor="middle">1</text>
  <text class="lb" x="242" y="290">로드 시 DOM → VNode</text>

  <line class="ln" x1="1002" y1="250" x2="1002" y2="314" marker-end="url(#ar)"/>
  <circle cx="792" cy="285" r="11" fill="#3182F6"/><text class="num" x="792" y="290" text-anchor="middle">2</text>
  <text class="lb" x="810" y="290">Patch 클릭 → 새 VNode</text>

  <rect class="card" x="48" y="320" width="300" height="150" rx="18"/>
  <text class="ct" x="70" y="356">이전 VNode</text>
  <text class="cc" x="70" y="380">지금 화면의 설계도</text>
  <g stroke="#C5CCD3" stroke-width="2"><line x1="276" y1="352" x2="246" y2="404"/><line x1="276" y1="352" x2="306" y2="404"/><line x1="246" y1="404" x2="226" y2="448"/><line x1="246" y1="404" x2="266" y2="448"/></g>
  <g fill="#B0B8C1"><circle cx="276" cy="352" r="11"/><circle cx="246" cy="404" r="10"/><circle cx="306" cy="404" r="10"/><circle cx="226" cy="448" r="9"/><circle cx="266" cy="448" r="9"/></g>

  <rect class="card" x="852" y="320" width="300" height="150" rx="18"/>
  <text class="ct" x="874" y="356">새 VNode</text>
  <text class="cc" x="874" y="380">수정 후의 설계도</text>
  <g stroke="#C5CCD3" stroke-width="2"><line x1="1080" y1="352" x2="1050" y2="404"/><line x1="1080" y1="352" x2="1110" y2="404"/><line x1="1050" y1="404" x2="1030" y2="448"/><line x1="1050" y1="404" x2="1070" y2="448"/></g>
  <g fill="#B0B8C1"><circle cx="1080" cy="352" r="11"/><circle cx="1050" cy="404" r="10"/><circle cx="1110" cy="404" r="10"/><circle cx="1030" cy="448" r="9"/></g>
  <circle cx="1070" cy="448" r="11" fill="#3182F6"/>

  <rect x="450" y="320" width="300" height="150" rx="20" fill="#3182F6"/>
  <text x="600" y="376" text-anchor="middle" font-size="30" font-weight="800" fill="#FFFFFF">Diff</text>
  <text x="600" y="410" text-anchor="middle" font-size="15" font-weight="500" fill="#E8F3FF">두 트리를 비교해서</text>
  <text x="600" y="434" text-anchor="middle" font-size="15" font-weight="500" fill="#E8F3FF">바뀐 곳만 변경 목록으로</text>

  <line class="ln" x1="348" y1="395" x2="444" y2="395" marker-end="url(#ar)"/>
  <line class="ln" x1="852" y1="395" x2="756" y2="395" marker-end="url(#ar)"/>

  <path class="ln" d="M600 320 L600 190 L356 190" marker-end="url(#ar)"/>
  <circle cx="392" cy="166" r="11" fill="#3182F6"/><text class="num" x="392" y="171" text-anchor="middle">3</text>
  <text class="lb" x="410" y="171">변경분만 Patch</text>

  <line class="ln" x1="1002" y1="470" x2="1002" y2="519" marker-end="url(#ar)"/>
  <circle cx="872" cy="495" r="11" fill="#3182F6"/><text class="num" x="872" y="500" text-anchor="middle">4</text>
  <text class="lb" x="890" y="500">History에 저장</text>

  <rect x="48" y="525" width="1104" height="62" rx="16" fill="#F2F4F6"/>
  <text class="ct" x="72" y="562" font-size="17">State History</text>
  <g font-size="14" font-weight="700">
    <rect x="232" y="540" width="60" height="32" rx="10" fill="#FFFFFF" stroke="#D1D6DB"/><text x="262" y="561" text-anchor="middle" fill="#6B7684">v1</text>
    <rect x="304" y="540" width="60" height="32" rx="10" fill="#FFFFFF" stroke="#D1D6DB"/><text x="334" y="561" text-anchor="middle" fill="#6B7684">v2</text>
    <rect x="376" y="540" width="60" height="32" rx="10" fill="#3182F6"/><text x="406" y="561" text-anchor="middle" fill="#FFFFFF">v3</text>
  </g>
  <text class="cc" x="462" y="561">뒤로, 앞으로 이동하면 두 영역이 그 시점의 VNode로 함께 복원</text>
  <g font-size="14" font-weight="700" fill="#4E5968">
    <rect x="956" y="540" width="86" height="32" rx="10" fill="#FFFFFF" stroke="#D1D6DB"/><text x="999" y="561" text-anchor="middle">◀ 뒤로</text>
    <rect x="1052" y="540" width="86" height="32" rx="10" fill="#FFFFFF" stroke="#D1D6DB"/><text x="1095" y="561" text-anchor="middle">앞으로 ▶</text>
  </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
