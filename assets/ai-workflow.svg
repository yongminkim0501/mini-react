<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" xmlns:c2pa="http://c2pa.org/manifest">
  <title>AI 활용 방식</title>
  <desc>로컬 세 곳의 AI 에이전트가 개발할 때마다 알고 넘긴 리스크를 risk_issue 디렉토리에 기록해 GitHub 이슈로 올리고, AI 정리 에이전트가 이슈끼리 중복과 영향을 판단해 닫거나 연결한다.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#8B95A1"/>
    </marker>
    <style>
      .h{font-size:26px;font-weight:800;fill:#191F28}
      .sub{font-size:16px;font-weight:500;fill:#8B95A1}
      .ct{font-size:19px;font-weight:700;fill:#191F28}
      .cc{font-size:14px;font-weight:500;fill:#6B7684}
      .card{fill:#F9FAFB;stroke:#E5E8EB;stroke-width:1.5}
      .ln{stroke:#B0B8C1;stroke-width:2;fill:none}
      .pl{font-size:13px;font-weight:700}
      .file{font-size:13px;font-weight:600;fill:#333D4B}
      .dir{font-size:15px;font-weight:800;fill:#1B64DA}
      .iss{font-size:14px;font-weight:600;fill:#333D4B}
      .no{font-size:14px;font-weight:800;fill:#3182F6}
    </style>
  </defs>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
  <rect x="1" y="1" width="1198" height="778" rx="24" fill="#FFFFFF" stroke="#E5E8EB" stroke-width="2"/>
  <text class="h" x="48" y="66">AI 활용 방식</text>
  <text class="sub" x="48" y="94">MVP로 빠르게 가되, 알고 넘긴 리스크는 기록하고 AI가 정리한다</text>

  <!-- local A -->
  <rect class="card" x="48" y="130" width="340" height="250" rx="18"/>
  <text class="ct" x="70" y="166">로컬 A</text>
  <text class="cc" x="70" y="190">개발자 + AI 에이전트</text>
  <rect x="70" y="210" width="128" height="32" rx="10" fill="#FFFFFF" stroke="#D1D6DB"/><text class="pl" x="134" y="231" text-anchor="middle" fill="#4E5968">개발 1회 진행</text>
  <line class="ln" x1="200" y1="226" x2="220" y2="226" marker-end="url(#ar)"/>
  <rect x="226" y="210" width="140" height="32" rx="10" fill="#E8F3FF"/><text class="pl" x="296" y="231" text-anchor="middle" fill="#1B64DA">리스크 기록</text>
  <path d="M70 270 L70 262 Q70 256 76 256 L140 256 L148 264 L360 264 Q366 264 366 270 L366 360 Q366 366 360 366 L76 366 Q70 366 70 360 Z" fill="#FFFFFF" stroke="#C9DFFF" stroke-width="1.5"/>
  <text class="dir" x="88" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">risk_issue/</text>
  <text class="file" x="88" y="322">· 순서 바뀌면 리스트 전부 재생성</text>
  <text class="file" x="88" y="348">· 측정 HUD 자체 비용</text>

  <!-- local B -->
  <rect class="card" x="430" y="130" width="340" height="250" rx="18"/>
  <text class="ct" x="452" y="166">로컬 B</text>
  <text class="cc" x="452" y="190">개발자 + AI 에이전트</text>
  <rect x="452" y="210" width="128" height="32" rx="10" fill="#FFFFFF" stroke="#D1D6DB"/><text class="pl" x="516" y="231" text-anchor="middle" fill="#4E5968">개발 1회 진행</text>
  <line class="ln" x1="582" y1="226" x2="602" y2="226" marker-end="url(#ar)"/>
  <rect x="608" y="210" width="140" height="32" rx="10" fill="#E8F3FF"/><text class="pl" x="678" y="231" text-anchor="middle" fill="#1B64DA">리스크 기록</text>
  <path d="M452 270 L452 262 Q452 256 458 256 L522 256 L530 264 L742 264 Q748 264 748 270 L748 360 Q748 366 742 366 L458 366 Q452 366 452 360 Z" fill="#FFFFFF" stroke="#C9DFFF" stroke-width="1.5"/>
  <text class="dir" x="470" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">risk_issue/</text>
  <text class="file" x="470" y="322">· Boundary 기록 메모리 비용</text>
  <text class="file" x="470" y="348">· 클릭 시 히트맵 캐시 깨짐</text>

  <!-- local C -->
  <rect class="card" x="812" y="130" width="340" height="250" rx="18"/>
  <text class="ct" x="834" y="166">로컬 C</text>
  <text class="cc" x="834" y="190">개발자 + AI 에이전트</text>
  <rect x="834" y="210" width="128" height="32" rx="10" fill="#FFFFFF" stroke="#D1D6DB"/><text class="pl" x="898" y="231" text-anchor="middle" fill="#4E5968">개발 1회 진행</text>
  <line class="ln" x1="964" y1="226" x2="984" y2="226" marker-end="url(#ar)"/>
  <rect x="990" y="210" width="140" height="32" rx="10" fill="#E8F3FF"/><text class="pl" x="1060" y="231" text-anchor="middle" fill="#1B64DA">리스크 기록</text>
  <path d="M834 270 L834 262 Q834 256 840 256 L904 256 L912 264 L1124 264 Q1130 264 1130 270 L1130 360 Q1130 366 1124 366 L840 366 Q834 366 834 360 Z" fill="#FFFFFF" stroke="#C9DFFF" stroke-width="1.5"/>
  <text class="dir" x="852" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">risk_issue/</text>
  <text class="file" x="852" y="322">· key 무시로 리스트 재생성</text>
  <text class="file" x="852" y="348">· 자식 컴포넌트 Hook 미지원</text>

  <!-- push arrows -->
  <line class="ln" x1="218" y1="380" x2="218" y2="434" marker-end="url(#ar)"/>
  <line class="ln" x1="600" y1="380" x2="600" y2="434" marker-end="url(#ar)"/>
  <line class="ln" x1="982" y1="380" x2="982" y2="434" marker-end="url(#ar)"/>
  <text class="cc" x="232" y="412" font-weight="600">push → 이슈로 등록</text>

  <!-- GitHub issues -->
  <rect x="48" y="440" width="1104" height="150" rx="20" fill="#F2F4F6"/>
  <text class="ct" x="72" y="474">GitHub Issues</text>

  <rect x="70" y="490" width="296" height="36" rx="10" fill="#FFFFFF" stroke="#D1D6DB"/>
  <text class="no" x="86" y="513">#21</text><text class="iss" x="122" y="513">순서 바뀌면 전부 재생성</text>
  <rect x="70" y="536" width="296" height="36" rx="10" fill="#FFFFFF" stroke="#D1D6DB"/>
  <text class="no" x="86" y="559">#22</text><text class="iss" x="122" y="559">측정 HUD 자체 비용</text>

  <rect x="452" y="490" width="296" height="36" rx="10" fill="#FFFFFF" stroke="#D1D6DB"/>
  <text class="no" x="468" y="513">#23</text><text class="iss" x="504" y="513">Boundary 기록 비용</text>
  <rect x="452" y="536" width="296" height="36" rx="10" fill="#FFFFFF" stroke="#D1D6DB"/>
  <text class="no" x="468" y="559">#24</text><text class="iss" x="504" y="559">클릭 시 캐시 깨짐</text>
  <rect x="680" y="497" width="56" height="22" rx="11" fill="#FFF4E5"/><text x="708" y="512" text-anchor="middle" font-size="12" font-weight="700" fill="#D9730D">영향</text>
  <rect x="680" y="543" width="56" height="22" rx="11" fill="#FFF4E5"/><text x="708" y="558" text-anchor="middle" font-size="12" font-weight="700" fill="#D9730D">영향</text>

  <rect x="834" y="490" width="296" height="36" rx="10" fill="#F9FAFB" stroke="#E5E8EB" stroke-dasharray="4 3"/>
  <text x="850" y="513" font-size="14" font-weight="800" fill="#B0B8C1">#25</text><text x="886" y="513" font-size="14" font-weight="600" fill="#B0B8C1" text-decoration="line-through">key 무시로 재생성</text>
  <rect x="1038" y="497" width="80" height="22" rx="11" fill="#E5E8EB"/><text x="1078" y="512" text-anchor="middle" font-size="12" font-weight="700" fill="#4E5968">중복 닫힘</text>
  <rect x="834" y="536" width="296" height="36" rx="10" fill="#FFFFFF" stroke="#D1D6DB"/>
  <text class="no" x="850" y="559">#26</text><text class="iss" x="886" y="559">자식 Hook 미지원</text>

  <!-- triage arrow -->
  <line x1="600" y1="596" x2="600" y2="634" stroke="#3182F6" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text class="cc" x="616" y="620" font-weight="600">이슈를 읽고 → 닫기, 연결, 라벨</text>

  <!-- triage agent -->
  <rect x="48" y="640" width="1104" height="112" rx="20" fill="#3182F6"/>
  <text x="72" y="676" font-size="20" font-weight="800" fill="#FFFFFF">AI 정리 에이전트</text>
  <text x="72" y="700" font-size="14" font-weight="500" fill="#E8F3FF">새 이슈가 올라오면 기존 이슈 전체와 비교해서 판단한다</text>
  <rect x="560" y="660" width="182" height="34" rx="10" fill="#FFFFFF" opacity="0.95"/>
  <text x="651" y="682" text-anchor="middle" font-size="13" font-weight="700" fill="#1B64DA">중복: #25 닫고 #21로</text>
  <rect x="754" y="660" width="182" height="34" rx="10" fill="#FFFFFF" opacity="0.95"/>
  <text x="845" y="682" text-anchor="middle" font-size="13" font-weight="700" fill="#1B64DA">영향: #23 ↔ #24 연결</text>
  <rect x="948" y="660" width="182" height="34" rx="10" fill="#FFFFFF" opacity="0.95"/>
  <text x="1039" y="682" text-anchor="middle" font-size="13" font-weight="700" fill="#1B64DA">해결된 이슈 닫기</text>
  <text x="845" y="728" text-anchor="middle" font-size="13" font-weight="500" fill="#E8F3FF">판단 근거는 이슈 코멘트로 남긴다</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
