<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" xmlns:c2pa="http://c2pa.org/manifest">
  <title>컴포넌트 펼치기</title>
  <desc>div fiber의 expand 단계에서 자식 목록의 Title 컴포넌트를 실행해 h1로 바꾸고, 결과 목록 h1, p로 자식 fiber를 만든다. 실제 React는 Title도 fiber가 되지만 mini-react는 host만 fiber가 된다.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#8B95A1"/>
    </marker>
    <style>
      .h{font-size:26px;font-weight:800;fill:#191F28}
      .sub{font-size:16px;font-weight:500;fill:#8B95A1}
      .ct{font-size:19px;font-weight:700;fill:#191F28}
      .cc{font-size:14px;font-weight:500;fill:#6B7684}
      .card{fill:#F9FAFB;stroke:#E5E8EB;stroke-width:1.5}
      .ln{stroke:#B0B8C1;stroke-width:2;fill:none}
      .code{font-size:15px;fill:#333D4B}
      .kw{fill:#1B64DA;font-weight:700}
      .step{font-size:15px;font-weight:700;fill:#333D4B}
      .host{fill:#E8F3FF}
      .ht{font-size:14px;font-weight:700;fill:#1B64DA}
      .comp{fill:#FFFFFF;stroke:#8B95A1;stroke-width:1.5;stroke-dasharray:5 4}
      .cpt{font-size:14px;font-weight:700;fill:#4E5968}
      .tl{stroke:#C5CCD3;stroke-width:2}
    </style>
  </defs>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
  <rect x="1" y="1" width="1198" height="618" rx="24" fill="#FFFFFF" stroke="#E5E8EB" stroke-width="2"/>
  <text class="h" x="48" y="66">컴포넌트 펼치기 (expand)</text>
  <text class="sub" x="48" y="94">컴포넌트는 fiber가 되지 않고, 자기를 감싸는 가장 가까운 host fiber 안에서 결과물로 바뀐다</text>

  <rect class="card" x="48" y="130" width="340" height="290" rx="18"/>
  <text class="ct" x="70" y="164">작성한 코드</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text class="code" x="70" y="206">&lt;div&gt;</text>
    <text class="code" x="94" y="232">&lt;<tspan class="kw">Title</tspan> text="hi" /&gt;</text>
    <text class="code" x="94" y="258">&lt;p&gt;bye&lt;/p&gt;</text>
    <text class="code" x="70" y="284">&lt;/div&gt;</text>
    <text class="code" x="70" y="326">function <tspan class="kw">Title</tspan>({ text }) {</text>
    <text class="code" x="94" y="352">return &lt;h1&gt;{text}&lt;/h1&gt;</text>
    <text class="code" x="70" y="378">}</text>
  </g>

  <line class="ln" x1="388" y1="275" x2="422" y2="275" marker-end="url(#ar)"/>

  <rect x="428" y="130" width="364" height="430" rx="22" fill="#F5F9FF" stroke="#C9DFFF" stroke-width="1.5"/>
  <text class="ct" x="452" y="164">div fiber의 expand 단계</text>
  <text class="cc" x="452" y="188">자식 목록을 한 칸씩 처리한다</text>

  <text class="step" x="452" y="226">1. input</text>
  <rect class="comp" x="452" y="240" width="96" height="32" rx="10"/><text class="cpt" x="500" y="261" text-anchor="middle">Title</text>
  <rect class="host" x="560" y="240" width="64" height="32" rx="10"/><text class="ht" x="592" y="261" text-anchor="middle">p</text>

  <line class="ln" x1="610" y1="282" x2="610" y2="302" marker-end="url(#ar)"/>

  <text class="step" x="452" y="326">2. Title() 실행 → 결과를 프레임에 쌓음</text>
  <rect x="452" y="340" width="316" height="46" rx="12" fill="#FFFFFF" stroke="#3182F6" stroke-width="1.5"/>
  <text x="472" y="368" font-size="14" font-weight="800" fill="#3182F6">F1</text>
  <rect class="host" x="508" y="347" width="64" height="32" rx="10"/><text class="ht" x="540" y="368" text-anchor="middle">h1</text>
  <text class="cc" x="590" y="368" font-size="13">Title이 반환한 것</text>
  <rect x="452" y="392" width="316" height="46" rx="12" fill="#FFFFFF" stroke="#C9DFFF" stroke-width="1.5"/>
  <text x="472" y="420" font-size="14" font-weight="800" fill="#8B95A1">F0</text>
  <rect class="comp" x="508" y="399" width="96" height="32" rx="10" opacity="0.45"/><text class="cpt" x="556" y="420" text-anchor="middle" opacity="0.45">Title ✓</text>
  <rect class="host" x="616" y="399" width="64" height="32" rx="10"/><text class="ht" x="648" y="420" text-anchor="middle">p</text>

  <line class="ln" x1="610" y1="448" x2="610" y2="468" marker-end="url(#ar)"/>

  <text class="step" x="452" y="492">3. resolved</text>
  <rect class="host" x="452" y="506" width="64" height="32" rx="10"/><text class="ht" x="484" y="527" text-anchor="middle">h1</text>
  <rect class="host" x="528" y="506" width="64" height="32" rx="10"/><text class="ht" x="560" y="527" text-anchor="middle">p</text>
  <text class="cc" x="610" y="527" font-size="13">→ 자식 fiber로 만듦</text>

  <line class="ln" x1="792" y1="360" x2="826" y2="360" marker-end="url(#ar)"/>

  <rect class="card" x="832" y="130" width="320" height="220" rx="18"/>
  <text class="ct" x="854" y="164">실제 React</text>
  <text class="cc" x="854" y="186">컴포넌트도 fiber가 된다</text>
  <line class="tl" x1="992" y1="231" x2="932" y2="251"/>
  <line class="tl" x1="992" y1="231" x2="1062" y2="251"/>
  <line class="tl" x1="932" y1="281" x2="932" y2="301"/>
  <rect class="host" x="957" y="201" width="70" height="30" rx="10"/><text class="ht" x="992" y="221" text-anchor="middle">div</text>
  <rect class="comp" x="887" y="251" width="90" height="30" rx="10"/><text class="cpt" x="932" y="271" text-anchor="middle">Title</text>
  <rect class="host" x="1032" y="251" width="60" height="30" rx="10"/><text class="ht" x="1062" y="271" text-anchor="middle">p</text>
  <rect class="host" x="902" y="301" width="60" height="30" rx="10"/><text class="ht" x="932" y="321" text-anchor="middle">h1</text>

  <rect x="832" y="370" width="320" height="190" rx="18" fill="#F5F9FF" stroke="#C9DFFF" stroke-width="1.5"/>
  <text class="ct" x="854" y="404">mini-react</text>
  <text class="cc" x="854" y="426">host만 fiber가 된다, DOM과 같은 모양</text>
  <line class="tl" x1="992" y1="487" x2="932" y2="507"/>
  <line class="tl" x1="992" y1="487" x2="1062" y2="507"/>
  <rect class="host" x="957" y="457" width="70" height="30" rx="10"/><text class="ht" x="992" y="477" text-anchor="middle">div</text>
  <rect class="host" x="902" y="507" width="60" height="30" rx="10"/><text class="ht" x="932" y="527" text-anchor="middle">h1</text>
  <rect class="host" x="1032" y="507" width="60" height="30" rx="10"/><text class="ht" x="1062" y="527" text-anchor="middle">p</text>

  <rect class="comp" x="48" y="574" width="92" height="28" rx="9"/><text class="cpt" x="94" y="593" text-anchor="middle" font-size="13">컴포넌트</text>
  <rect class="host" x="152" y="574" width="92" height="28" rx="9"/><text class="ht" x="198" y="593" text-anchor="middle" font-size="13">host 태그</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
