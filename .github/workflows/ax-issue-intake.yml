name: AX issue intake and Claude feedback

on:
  push:
    branches: ['**']
    paths: ['issue-*/**']
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Read issue files from this repository branch'
        required: true
        default: main

# One queue for stable source IDs and coordination-issue deduplication.
# Every run scans the latest source branch, including files missed by coalesced push events.
concurrency:
  group: ax-issue-intake
  cancel-in-progress: false
permissions: {}

jobs:
  register:
    if: vars.AX_ISSUE_INTAKE_ENABLED == 'true' && github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      # Run reviewed automation from the default branch. Source-branch code is never executed.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate team membership and register issue files
        run: node scripts/ax/issue-intake.mjs register
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: ax-intake-batch
          path: /tmp/ax-intake/batch.json
          retention-days: 1
          if-no-files-found: error

  analyze:
    needs: register
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ax-intake-batch
          path: /tmp/ax-intake
      - name: Read team issues and request constrained Claude assessment
        run: node scripts/ax/issue-intake.mjs infer
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AX_TRIAGE_MODEL: ${{ vars.AX_TRIAGE_MODEL }}
      - uses: actions/upload-artifact@v4
        with:
          name: ax-intake-results
          path: /tmp/ax-intake/results.json
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ax-intake-results
          path: /tmp/ax-intake
      - name: Validate references and publish feedback or one coordination issue
        run: node scripts/ax/issue-intake.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
