name: 기술 부채
description: 현재 타협과 개선을 촉발할 조건을 기록합니다.
labels:
- type:debt
body:
- type: markdown
  attributes:
    value: 템플릿 v0.1 · 모르는 항목은 비우지 말고 **미확인**으로 적습니다. 등록 후 영역 라벨을 붙이고, 버그·리스크는 심각도 라벨도 붙입니다. ready·담당 배정·리스크
      수용은 사람이 확정합니다.
- type: textarea
  id: compromise
  attributes:
    label: 현재 타협
    description: 현재 구현의 타협과 배경.
  validations:
    required: true
- type: textarea
  id: consequence
  attributes:
    label: 타협의 영향
    description: 유지보수·성능·안정성에 미치는 영향.
  validations:
    required: true
- type: textarea
  id: trigger
  attributes:
    label: 개선 촉발 조건
    description: 언제 개선할지 확인 가능한 조건.
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: 완료 조건
    description: 사전 정의한 개선 조건과 검증 방법.
  validations:
    required: true
- type: textarea
  id: review_owner
  attributes:
    label: 재검토 담당자
    description: 재검토할 사람의 GitHub 계정. 이슈 배정은 동기화에서 사람이 수행.
  validations:
    required: true
- type: textarea
  id: areas
  attributes:
    label: 예상 변경 영역
    description: 'areas.yml에서 영역을 고르고 area: 라벨을 별도로 붙입니다. 판단 불가 시 area:unknown.'
  validations:
    required: true
- type: textarea
  id: impact
  attributes:
    label: 파급 범위
    description: 영향받는 기능과 사용자 시나리오, 필요한 리뷰·테스트 범위.
  validations:
    required: true
- type: textarea
  id: overlap
  attributes:
    label: 동일 영역 진행 작업
    description: 같은 영역의 열린 PR·진행 중 이슈 링크와 사람 담당자 @멘션. 없으면 없음.
  validations:
    required: true
