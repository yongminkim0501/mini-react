name: 문서 작업
description: 빠지거나 잘못된 문서와 검증 조건을 기록합니다.
labels:
- type:docs
body:
- type: markdown
  attributes:
    value: 템플릿 v0.1 · 모르는 항목은 비우지 말고 **미확인**으로 적습니다. 등록 후 영역 라벨을 붙이고, 버그·리스크는 심각도 라벨도 붙입니다. ready·담당 배정·리스크
      수용은 사람이 확정합니다.
- type: textarea
  id: problem
  attributes:
    label: 잘못되거나 빠진 내용
    description: 현재 문서의 경로와 보완할 내용.
  validations:
    required: true
- type: textarea
  id: audience
  attributes:
    label: 대상 사용자
    description: 누가 어떤 상황에서 읽는가.
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: 완료 조건
    description: 문서 반영과 예제 실행·링크 검증 조건.
  validations:
    required: true
- type: textarea
  id: areas
  attributes:
    label: 예상 변경 영역
    description: 'areas.yml에서 영역을 고르고 area: 라벨을 별도로 붙입니다. 판단 불가 시 area:unknown.'
  validations:
    required: true
- type: textarea
  id: impact
  attributes:
    label: 파급 범위
    description: 영향받는 기능과 사용자 시나리오, 필요한 리뷰·테스트 범위.
  validations:
    required: true
- type: textarea
  id: overlap
  attributes:
    label: 동일 영역 진행 작업
    description: 같은 영역의 열린 PR·진행 중 이슈 링크와 사람 담당자 @멘션. 없으면 없음.
  validations:
    required: true
