name: 버그
description: 기대와 다른 동작과 재현 증거를 기록합니다.
labels:
- type:bug
body:
- type: markdown
  attributes:
    value: 템플릿 v0.1 · 모르는 항목은 비우지 말고 **미확인**으로 적습니다. 등록 후 영역 라벨을 붙이고, 버그·리스크는 심각도 라벨도 붙입니다. ready·담당 배정·리스크
      수용은 사람이 확정합니다.
- type: dropdown
  id: severity
  attributes:
    label: 심각도
    description: '등록 후 동일한 sev: 라벨을 붙입니다. 미확인은 동기화에서 확정합니다.'
    options:
    - sev:high
    - sev:mid
    - sev:low
    - 미확인
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: 기대 동작
    description: 정상적으로 기대하는 결과.
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: 실제 동작
    description: 관찰한 결과와 오류 메시지.
  validations:
    required: true
- type: textarea
  id: reproduction
  attributes:
    label: 재현 방법
    description: 가능하면 테스트 파일 경로나 실행 명령과 입력값.
  validations:
    required: true
- type: textarea
  id: commit
  attributes:
    label: 관찰 커밋
    description: 문제를 관찰한 전체 커밋 SHA.
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: 완료 조건
    description: 수정 결과와 회귀 검증 조건을 확인 가능한 체크리스트로 작성.
  validations:
    required: true
- type: textarea
  id: areas
  attributes:
    label: 예상 변경 영역
    description: 'areas.yml에서 영역을 고르고 area: 라벨을 별도로 붙입니다. 판단 불가 시 area:unknown.'
  validations:
    required: true
- type: textarea
  id: impact
  attributes:
    label: 파급 범위
    description: 영향받는 기능과 사용자 시나리오, 필요한 리뷰·테스트 범위.
  validations:
    required: true
- type: textarea
  id: overlap
  attributes:
    label: 동일 영역 진행 작업
    description: 같은 영역의 열린 PR·진행 중 이슈 링크와 사람 담당자 @멘션. 없으면 없음.
  validations:
    required: true
- type: textarea
  id: regression
  attributes:
    label: 회귀 원인
    description: '병합된 변경이 원인이면 regression 라벨과 Caused-by #PR번호를 기록합니다. 불확실하면 원인 번호는 비워 두고 확인 후 채웁니다. 해당
      없으면 없음.'
  validations:
    required: false
