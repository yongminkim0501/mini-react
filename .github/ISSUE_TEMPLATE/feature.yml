name: 미구현 기능
description: 필요한 기능의 범위와 완료 조건을 기록합니다.
labels:
- type:feature
body:
- type: markdown
  attributes:
    value: 템플릿 v0.1 · 모르는 항목은 비우지 말고 **미확인**으로 적습니다. 등록 후 영역 라벨을 붙이고, 버그·리스크는 심각도 라벨도 붙입니다. ready·담당 배정·리스크
      수용은 사람이 확정합니다.
- type: textarea
  id: need
  attributes:
    label: 필요성
    description: 누구에게 왜 필요한가.
  validations:
    required: true
- type: textarea
  id: scope
  attributes:
    label: 범위
    description: 포함할 동작과 범위 밖 항목.
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: 완료 조건
    description: 구현·검증할 필수 기능을 확인 가능한 체크리스트로 작성.
  validations:
    required: true
- type: textarea
  id: dependencies
  attributes:
    label: 의존 관계
    description: 선행 이슈와 변경 전제. 없으면 없음.
  validations:
    required: true
- type: textarea
  id: areas
  attributes:
    label: 예상 변경 영역
    description: 'areas.yml에서 영역을 고르고 area: 라벨을 별도로 붙입니다. 판단 불가 시 area:unknown.'
  validations:
    required: true
- type: textarea
  id: impact
  attributes:
    label: 파급 범위
    description: 영향받는 기능과 사용자 시나리오, 필요한 리뷰·테스트 범위.
  validations:
    required: true
- type: textarea
  id: overlap
  attributes:
    label: 동일 영역 진행 작업
    description: 같은 영역의 열린 PR·진행 중 이슈 링크와 사람 담당자 @멘션. 없으면 없음.
  validations:
    required: true
