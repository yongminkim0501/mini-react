name: 수용 검토 리스크
description: 영향과 수용 근거를 기록하고 사람의 수용 판단을 받습니다.
labels:
- type:risk
body:
- type: markdown
  attributes:
    value: 템플릿 v0.1 · 모르는 항목은 비우지 말고 **미확인**으로 적습니다. 등록 후 영역 라벨을 붙이고, 버그·리스크는 심각도 라벨도 붙입니다. ready·담당 배정·리스크
      수용은 사람이 확정합니다.
- type: dropdown
  id: severity
  attributes:
    label: 심각도
    description: '등록 후 동일한 sev: 라벨을 붙입니다. 미확인은 동기화에서 확정합니다.'
    options:
    - sev:high
    - sev:mid
    - sev:low
    - 미확인
  validations:
    required: true
- type: textarea
  id: consequence
  attributes:
    label: 리스크 영향
    description: 발생 조건, 영향과 심각도.
  validations:
    required: true
- type: textarea
  id: reason
  attributes:
    label: 수용 이유
    description: MVP에서 수용하려는 이유. 수용 여부는 사람이 결정.
  validations:
    required: true
- type: textarea
  id: risk_owner
  attributes:
    label: 리스크 담당자
    description: 검토·대응할 사람의 GitHub 계정. 이슈 배정은 사람이 수행.
  validations:
    required: true
- type: textarea
  id: mitigation
  attributes:
    label: 완화책
    description: 현재 가능한 완화와 대응 방법.
  validations:
    required: true
- type: textarea
  id: review_trigger
  attributes:
    label: 재검토 조건
    description: 수용을 다시 검토할 구체적인 조건.
  validations:
    required: true
- type: textarea
  id: review_date
  attributes:
    label: 재검토 기한
    description: YYYY-MM-DD. 미정이면 미확인.
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: 완료·처리 기준
    description: 수용 유지 또는 위험 제거를 확인할 증거. risk:accepted는 열어 둡니다.
  validations:
    required: true
- type: textarea
  id: areas
  attributes:
    label: 예상 변경 영역
    description: 'areas.yml에서 영역을 고르고 area: 라벨을 별도로 붙입니다. 판단 불가 시 area:unknown.'
  validations:
    required: true
- type: textarea
  id: impact
  attributes:
    label: 파급 범위
    description: 영향받는 기능과 사용자 시나리오, 필요한 리뷰·테스트 범위.
  validations:
    required: true
- type: textarea
  id: overlap
  attributes:
    label: 동일 영역 진행 작업
    description: 같은 영역의 열린 PR·진행 중 이슈 링크와 사람 담당자 @멘션. 없으면 없음.
  validations:
    required: true
